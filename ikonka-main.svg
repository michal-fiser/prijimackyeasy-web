<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Váš specifický gradient z webu -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />   <!-- Tailwind blue-500 -->
      <stop offset="50%" stop-color="#a855f7" />  <!-- Tailwind purple-500 -->
      <stop offset="100%" stop-color="#f43f5e" /> <!-- Tailwind rose-500 -->
    </linearGradient>
  </defs>
  
  <!-- Zaoblený čtverec s gradientem na pozadí -->
  <rect width="100" height="100" rx="25" fill="url(#grad)" />
  
  <!-- Emoji uprostřed -->
  <text x="50" y="54" font-size="55" text-anchor="middle" dominant-baseline="middle">✌️</text>
</svg>
