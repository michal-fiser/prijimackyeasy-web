<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Přijímačky? Easy! - Výběr předmětu</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col justify-center items-center p-6">
    
    <!-- Hlavička rozcestníku -->
    <div class="text-center mb-12 mt-10">
        <h1 class="text-5xl md:text-6xl font-extrabold text-slate-900 mb-6 tracking-tight">
            Přijímačky? <span class="text-blue-500">Easy!</span> ✌️
        </h1>
        <p class="text-xl md:text-2xl text-slate-600">
            Vyber si předmět, se kterým potřebuješ pomoct:
        </p>
    </div>

    <!-- Výběr předmětů -->
    <div class="grid md:grid-cols-2 gap-8 max-w-4xl w-full mb-10">
        
        <!-- MATEMATIKA -->
        <a href="/matika" class="group bg-white p-12 rounded-3xl shadow-md border-2 border-transparent hover:border-blue-500 hover:shadow-xl transition duration-300 transform hover:-translate-y-2 text-center block">
            <div class="text-7xl mb-6 transform group-hover:scale-110 transition duration-300">📐</div>
            <h2 class="text-3xl font-bold text-blue-900 mb-3 group-hover:text-blue-600 transition duration-300">Matematika</h2>
            <p class="text-lg text-slate-500 font-medium">s Michalem</p>
        </a>

        <!-- ČEŠTINA -->
        <a href="/cestina" class="group bg-white p-12 rounded-3xl shadow-md border-2 border-transparent hover:border-rose-500 hover:shadow-xl transition duration-300 transform hover:-translate-y-2 text-center block">
            <div class="text-7xl mb-6 transform group-hover:scale-110 transition duration-300">📚</div>
            <h2 class="text-3xl font-bold text-rose-900 mb-3 group-hover:text-rose-600 transition duration-300">Čeština</h2>
            <p class="text-lg text-slate-500 font-medium">se Silvou</p>
        </a>

        <!-- OBOJÍ -->
        <div class="md:col-span-2 flex justify-center">
            <a href="/oboji" class="group bg-white p-12 rounded-3xl shadow-md border-2 border-transparent hover:border-slate-400 hover:shadow-xl transition duration-300 transform hover:-translate-y-2 text-center block w-full md:w-[calc(50%-1rem)]">
                <div class="text-7xl mb-6 transform group-hover:scale-110 transition duration-300">🥀</div>
                <h2 class="text-3xl font-bold text-slate-800 mb-3 group-hover:text-slate-600 transition duration-300">Obojí</h2>
                <p class="text-lg text-slate-500 font-medium">S Michalem a Silvou</p>
            </a>
        </div>

    </div>

</body>
</html>
